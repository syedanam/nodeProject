name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  APP_ENV: development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
        
      - name: Show environment
        run: echo "This app is running in $APP_ENV mode"

      - name: Use secret
        run: echo "The secret value is $MY_SECRET"
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}


  deploy-check:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Confirm ready
        run: echo "All tests passed on all Node versions — ready for the next stage!"      